<div class="page-container">
  <div class="default-card">
    <div class="form-header">
      <h3 class="title">{{ '_add' | translate: { param: ('station' | translate) } }}</h3>
    </div>
    <div class="content">
      <form class="form" [formGroup]="form">
        <div class="container-fluid">
          <div class="row">
            <div class="col-lg-4">
              <app-form-helper [label]="'name' | translate" [control]="form.controls.station_name">
                <mat-form-field appearance="outline" class="default-input full-width">
                  <input type="text" matInput [formControl]="form.controls.station_name" />
                </mat-form-field>
              </app-form-helper>
            </div>
            <div class="col-lg-4">
              <app-form-helper [label]="'latitude' | translate" [control]="form.controls.latitude">
                <mat-form-field appearance="outline" class="default-input full-width">
                  <input type="number" matInput [formControl]="form.controls.latitude" />
                </mat-form-field>
              </app-form-helper>
            </div>
            <div class="col-lg-4">
              <app-form-helper
                [label]="'longitude' | translate"
                [control]="form.controls.longitude"
              >
                <mat-form-field appearance="outline" class="default-input full-width">
                  <input type="number" matInput [formControl]="form.controls.longitude" />
                </mat-form-field>
              </app-form-helper>
            </div>
            <div class="col-lg-12">
              <div id="map" #mapContainer></div>
            </div>
          </div>
        </div>
      </form>
      <div class="d-flex justify-content-end align-items-center gap-2 mt-3">
        <a
          type="button"
          mat-stroked-button
          color="primary"
          [routerLink]="updateId !== '' ? '../../' : '../'"
        >
          {{ 'actions.cancel' | translate }}
        </a>
        <button type="button" mat-flat-button color="primary" (click)="onSave()">
          <mat-icon>save</mat-icon>
          {{ 'actions.save' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
