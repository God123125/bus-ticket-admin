<div class="page-container">
  <div class="default-card">
    <div class="form-header">
      <h3 class="title">{{ '_detail' | translate: { param: ('station' | translate) } }}</h3>
      <button mat-stroked-button color="primary" [routerLink]="'../'">
        {{ 'actions.back' | translate }}
      </button>
    </div>
    <div class="content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-lg-4">
            <div class="info">
              <p class="label">{{ 'name' | translate }}</p>
              <p class="value">{{ station().station_name }}</p>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="info">
              <p class="label">{{ 'latitude' | translate }}</p>
              <p class="value">{{ station().latitude }}</p>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="info">
              <p class="label">{{ 'longitude' | translate }}</p>
              <p class="value">{{ station().longitude }}</p>
            </div>
          </div>
          <div class="col-lg-12">
            <div id="map" #mapContainer></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
