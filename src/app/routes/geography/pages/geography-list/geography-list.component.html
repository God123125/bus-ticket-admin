<div class="page-container">
  <div class="scroll-container">
    <h3 class="title">{{ 'route.user-management' | translate }}</h3>
    <div class="header-content d-flex justify-content-between align-items-center">
      <mat-form-field appearance="outline" class="default-input h mb-0" [floatLabel]="'always'">
        <mat-label>{{ 'actions.search' | translate }}</mat-label>
        <input type="text" matInput (keyup)="onSearch($event)" />
      </mat-form-field>
      <a mat-raised-button class="ml-auto" color="primary" routerLink="create">
        <mat-icon>add</mat-icon>
        <span>{{ 'actions.create' | translate }}</span>
      </a>
    </div>
    <div class="table-container content-scroll">
      <table class="table-custom mb-0">
        <thead>
          <tr>
            <th scope="col">{{ 'n.o' | translate }}</th>
            <th scope="col">{{ 'username' | translate }}</th>
            <th scope="col">{{ 'address' | translate }}</th>
            <th scope="col">{{ 'phone_number' | translate }}</th>
            <!-- <th scope="col">{{ 'company' | translate }}</th> -->
            <th scope="col">{{ 'action' | translate }}</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
          </tr>
        </tbody>
      </table>
      <mat-paginator
        [length]="total()"
        [pageSize]="params.limit"
        [pageSizeOptions]="[5, 10, 25, 100]"
        [showFirstLastButtons]="true"
        aria-label="Select page"
        (page)="onPageChange($event)"
      />
    </div>
  </div>
</div>
