<div class="chart-card">
  <div class="chart-header d-flex align-items-center">
    <h4 class="title">{{ 'booking_status' | translate }}</h4>
  </div>
  <div class="chart-body">
    <canvas
      id="bookingStatusDoughnutChart"
      baseChart
      [data]="doughnutChartData"
      [options]="doughnutChartOption"
      [type]="'doughnut'"
    >
    </canvas>
  </div>
</div>
