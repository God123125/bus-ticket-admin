<div class="chart-card">
  <div class="chart-header">
    <h4 class="title">{{ 'weekly_revenue' | translate }}</h4>
  </div>
  <div class="chart-body">
    <canvas
      id="lineChart"
      baseChart
      [data]="lineChartData"
      [options]="lineChartOption"
      [type]="'line'"
    >
    </canvas>
  </div>
</div>
