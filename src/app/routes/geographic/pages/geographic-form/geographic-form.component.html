<div class="page-container">
  <div class="default-card">
    <div class="form-header">
      <h3 class="title">{{ '_add' | translate: { param: ('geographic' | translate) } }}</h3>
    </div>
    <div class="content">
      <form [formGroup]="form" class="form">
        <div class="container-fluid">
          <div class="row">
            <div class="col-lg-6">
              <app-form-helper [label]="'name_kh' | translate" [control]="form.controls.name_kh">
                <mat-form-field appearance="outline" class="default-input full-width">
                  <input type="text" matInput [formControl]="form.controls.name_kh" />
                </mat-form-field>
              </app-form-helper>
            </div>
            <div class="col-lg-6">
              <app-form-helper [label]="'name_en' | translate" [control]="form.controls.name_en">
                <mat-form-field appearance="outline" class="default-input full-width">
                  <input type="text" matInput [formControl]="form.controls.name_en" />
                </mat-form-field>
              </app-form-helper>
            </div>
          </div>
        </div>
      </form>
      <div class="d-flex justify-content-end align-items-center gap-2">
        <a type="button" mat-stroked-button color="primary" [routerLink]="'../'">
          {{ 'actions.cancel' | translate }}
        </a>
        <button type="button" mat-flat-button color="primary">
          <mat-icon>save</mat-icon>
          {{ 'actions.save' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
