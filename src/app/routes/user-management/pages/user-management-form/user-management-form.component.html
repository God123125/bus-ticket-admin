<div class="page-container">
  <div class="default-card">
    <div class="form-header">
      <h3 class="title">{{ '_add' | translate: { param: ('user' | translate) } }}</h3>
    </div>
    <div class="content">
      <div class="row">
        <div class="col-lg-2 d-flex align-items-center">
          <div class="image-container">
            <input
              type="file"
              style="display: none"
              #fileInput
              (change)="onFileSelected($event)"
              accept="image/*"
            />
            <img [src]="profile || '/assets/imgs/user-profile.svg'" alt="" />
            <button mat-icon-button class="edit-btn" (click)="fileInput.click()">
              <mat-icon>edit</mat-icon>
            </button>
          </div>
        </div>
        <div class="col-lg-10">
          <form class="form" [formGroup]="form">
            <div class="container-fluid">
              <div class="row">
                <div class="col-lg-4">
                  <app-form-helper [label]="'name' | translate">
                    <mat-form-field appearance="outline" class="default-input full-width">
                      <input type="text" matInput [formControl]="form.controls.full_name" />
                    </mat-form-field>
                  </app-form-helper>
                </div>
                <div class="col-lg-4">
                  <app-form-helper [label]="'username' | translate">
                    <mat-form-field appearance="outline" class="default-input full-width">
                      <input type="text" matInput [formControl]="form.controls.username" />
                    </mat-form-field>
                  </app-form-helper>
                </div>
                <div class="col-lg-4">
                  <app-form-helper [label]="'password' | translate">
                    <mat-form-field appearance="outline" class="default-input full-width">
                      <input type="password" matInput [formControl]="form.controls.password" />
                    </mat-form-field>
                  </app-form-helper>
                </div>
                <div class="col-lg-4">
                  <app-form-helper [label]="'phone_number' | translate">
                    <mat-form-field appearance="outline" class="default-input full-width">
                      <input type="text" matInput [formControl]="form.controls.tel" />
                    </mat-form-field>
                  </app-form-helper>
                </div>
                <div class="col-lg-4">
                  <app-form-helper [label]="'bank_acc_name' | translate">
                    <mat-form-field appearance="outline" class="default-input full-width">
                      <input type="text" matInput [formControl]="form.controls.bank_acc_name" />
                    </mat-form-field>
                  </app-form-helper>
                </div>
                <div class="col-lg-4">
                  <app-form-helper [label]="'bank_acc_number' | translate">
                    <mat-form-field appearance="outline" class="default-input full-width">
                      <input type="text" matInput [formControl]="form.controls.bank_acc_number" />
                    </mat-form-field>
                  </app-form-helper>
                </div>
                <div class="col-lg-6">
                  <app-form-helper [label]="'company' | translate">
                    <mat-form-field appearance="outline" class="default-input full-width">
                      <mat-select [formControl]="form.controls.company">
                        @for (company of companies(); track company._id) {
                          <mat-option [value]="company._id">{{ company.name }}</mat-option>
                        }
                      </mat-select>
                    </mat-form-field>
                  </app-form-helper>
                </div>
                <div class="col-lg-6">
                  <app-form-helper [label]="'address' | translate">
                    <mat-form-field appearance="outline" class="default-input full-width">
                      <textarea
                        type="text"
                        matInput
                        [formControl]="form.controls.address"
                      ></textarea>
                    </mat-form-field>
                  </app-form-helper>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="d-flex justify-content-end align-items-center gap-2">
        <a
          type="button"
          mat-stroked-button
          color="primary"
          [routerLink]="updateId !== '' ? '../../' : '../'"
        >
          {{ 'actions.cancel' | translate }}
        </a>
        <button type="button" mat-flat-button color="primary" (click)="onSave()">
          <mat-icon>save</mat-icon>
          {{ 'actions.save' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
