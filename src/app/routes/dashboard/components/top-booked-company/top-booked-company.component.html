<div class="chart-card">
  <div class="chart-header">
    <h4 class="title">{{ 'company_performance_statistic' | translate }}</h4>
  </div>
  <div class="chart-body">
    <canvas
      id="topBookedDestinationsChart"
      baseChart
      [data]="barChartData"
      [options]="barChartOption"
      [type]="'bar'"
    >
    </canvas>
  </div>
</div>
