<h3 mat-dialog-title class="title">
  {{ (data?.id ? '_edit' : '_create') | translate: { param: 'promo_code' | translate } }}
</h3>
<mat-dialog-content>
  <form [formGroup]="form">
    <div class="container-fluid py-2">
      <div class="row">
        <app-form-helper
          class="col-lg-6"
          [control]="form.controls.code"
          [label]="'code' | translate"
        >
          <mat-form-field appearance="outline" class="default-input w-100">
            <input type="text" matInput [formControl]="form.controls.code" />
          </mat-form-field>
        </app-form-helper>
        <app-form-helper
          class="col-lg-6"
          [control]="form.controls.discountType"
          [label]="'discount_type' | translate"
        >
          <mat-form-field appearance="outline" class="default-input w-100">
            <mat-select [formControl]="form.controls.discountType">
              @for (type of discountTypes; track type) {
                <mat-option [value]="type">{{ type | translate }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </app-form-helper>
        <app-form-helper
          class="col-lg-6"
          [control]="form.controls.value"
          [label]="'value' | translate"
        >
          <mat-form-field appearance="outline" class="default-input w-100">
            <input type="number" matInput [formControl]="form.controls.value" />
          </mat-form-field>
        </app-form-helper>
        <app-form-helper
          class="col-lg-6"
          [control]="form.controls.maxUses"
          [label]="'max_uses' | translate"
        >
          <mat-form-field appearance="outline" class="default-input w-100">
            <input type="number" matInput [formControl]="form.controls.maxUses" />
          </mat-form-field>
        </app-form-helper>
        <app-form-helper
          class="col-lg-6"
          [control]="form.controls.is_active"
          [label]="'status' | translate"
        >
          <mat-form-field appearance="outline" class="default-input w-100">
            <mat-select [formControl]="form.controls.is_active">
              <mat-option [value]="true">{{ 'active' | translate }}</mat-option>
              <mat-option [value]="false">{{ 'inactive' | translate }}</mat-option>
            </mat-select>
          </mat-form-field>
        </app-form-helper>
        <app-form-helper
          class="col-lg-6"
          [control]="form.controls.expiresAt"
          [label]="'expires_at' | translate"
        >
          <mat-form-field appearance="outline" class="default-input full-width">
            <input matInput [matDatepicker]="picker" [formControl]="form.controls.expiresAt" />
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
        </app-form-helper>
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button color="primary" mat-dialog-close>
    {{ 'actions.cancel' | translate }}
  </button>
  <button mat-flat-button color="primary" (click)="onSubmit()">
    {{ 'actions.save' | translate }}
  </button>
</mat-dialog-actions>
